name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Compile, check formatting and lint
        run: sbt --server --batch "compile; Test/compile; scalafmtCheckAll; scalafmtSbtCheck; scalafixAll --check"
