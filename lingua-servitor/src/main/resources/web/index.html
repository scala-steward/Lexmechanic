<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexmechanic</title>
<link rel="icon" href="/emblem.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  :root {
    --bg: #0e0d0b;
    --panel: #17150f;
    --line: #3a3222;
    --text: #ece3cf;
    --muted: #8f8570;
    --brass: #c9a24a;
    --red: #b3372b;
    --green: #6fbf73;
    --display: "Cinzel", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { font: 400 24px/1.45 "EB Garamond", Georgia, serif; }
  #app, .shell { height: 100%; }
  .shell { display: flex; flex-direction: column; }
  button {
    font: 500 15px var(--display); letter-spacing: .08em; text-transform: uppercase;
    color: var(--brass); background: transparent; border: 1px solid var(--line); border-radius: 3px;
    padding: 8px 14px; cursor: pointer; touch-action: manipulation;
  }
  button:hover, button:focus-visible { border-color: var(--brass); outline: none; }
  button:disabled { opacity: .4; cursor: default; }
  .hotkey-label { font: 500 12px var(--display); letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
  button[data-learning="true"] { border-color: var(--brass); animation: pulse 1s ease-in-out infinite; }

  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .title { display: flex; align-items: center; gap: 10px; font: 700 17px var(--display); letter-spacing: .2em; color: var(--brass); margin-right: auto; }
  .title img { width: 32px; height: 32px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); margin-right: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status[data-state="busy"] .dot { background: var(--brass); animation: pulse 1s ease-in-out infinite; }
  .status[data-state="ready"] .dot { background: var(--green); }
  .status[data-state="offline"] .dot, .status[data-state="failed"] .dot { background: var(--red); }
  @keyframes pulse { 50% { opacity: .25; } }

  main { flex: 1; overflow-y: auto; padding: 20px 28px 40px; }
  main > * { max-width: 1100px; margin-inline: auto; }
  .error { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 1100px; margin-inline: auto; z-index: 20; border: 1px solid var(--red); color: #f0c2bb; background: #2a1310; padding: 10px 14px; font-size: 16px; white-space: pre-wrap; }
  .hint { color: var(--muted); font-size: 18px; margin-bottom: 18px; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; font-style: italic; }

  .entry { margin-bottom: 28px; }
  .speaker { font: 700 18px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--brass); margin-bottom: 4px; }
  .pl { margin: 0; }
  .en { margin: 4px 0 0; color: var(--muted); font-size: 16px; font-style: italic; }
  .shell:not(.show-en) .en { display: none; }
  ol { list-style: none; margin: 16px 0 0; padding: 0; }
  li { border-left: 2px solid var(--brass); padding: 4px 0 4px 14px; margin-bottom: 10px; font-size: 21px; }

  .history-title { font: 500 13px var(--display); letter-spacing: .2em; color: var(--muted); margin-top: 36px; margin-bottom: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
  .history .entry { font-size: 18px; opacity: .7; margin-bottom: 20px; }
  .history .speaker { font-size: 14px; }
  .history li { font-size: 16px; border-left-color: var(--line); }

  #calibration { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
  #calibration.open { display: flex; }
  #calibration header { background: transparent; }
  #calibration .instructions { font-size: 16px; color: var(--text); margin-right: auto; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; min-height: 0; }
  .frame { position: relative; max-width: 100%; max-height: 100%; touch-action: none; user-select: none; }
  .frame img { display: block; max-width: 100%; max-height: calc(100vh - 90px); }
  .selection { position: absolute; border: 2px solid var(--brass); background: color-mix(in srgb, var(--brass) 15%, transparent); pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/main.js"></script>
</body>
</html>
